<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Gallery</title>
    <style>
        body { font-family: sans-serif; background: #333; color: #fff; margin: 0; }
        header { padding: 20px; background: #000; text-align: center; position: sticky; top: 0; z-index: 100;}
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            padding: 10px;
        }
        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #555;
            background: #222;
        }
        .back-btn { color: #fff; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 10px;}
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">← Back to Exhibition</a>
        <h2 style="margin:0;">Archive Documents</h2>
        <p style="font-size: 0.8rem; color: #aaa;">200+ Original Scans</p>
    </header>
    
    <div class="gallery" id="gallery-container"></div>

    <script>
        const container = document.getElementById('gallery-container');
        const totalImages = 200; // 档案图片的数量
        
        for (let i = 1; i <= totalImages; i++) {
            const img = document.createElement('img');
            // 这里固定为 .jpg，因为你确认是扫描件
            img.src = `doc-${i}.jpg`; 
            img.loading = "lazy"; 
            
            // 点击查看原图
            img.onclick = function() { window.open(this.src, '_blank'); };
            
            // 如果某张图不存在，自动隐藏
            img.onerror = function() { this.style.display = 'none'; };
            
            container.appendChild(img);
        }
    </script>
</body>
</html>
